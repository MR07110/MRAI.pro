<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    /* Default (and the fallback for browsers that ignore this): dark colors — white outline/pins on a transparent
       background, which reads well on a dark browser/tab theme. */
    .mrai-icon-fg { fill: #fff; }
    .mrai-icon-frame { stroke: #fff; }
    /* Light browser/tab theme: invert so the icon stays legible — black outline/pins on a transparent background. */
    @media (prefers-color-scheme: light) {
      .mrai-icon-fg { fill: #000; }
      .mrai-icon-frame { stroke: #000; }
    }
  </style>


  <!-- top pins (4) -->
  <rect x="7" y="1" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="10" y="1" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="13" y="1" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="16" y="1" width="2" height="2" class="mrai-icon-fg"/>

  <!-- bottom pins (3) -->
  <rect x="8" y="21" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="11" y="21" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="14" y="21" width="2" height="2" class="mrai-icon-fg"/>

  <!-- left pins (3) -->
  <rect x="1" y="8" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="1" y="11" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="1" y="14" width="2" height="2" class="mrai-icon-fg"/>

  <!-- right pins (3) -->
  <rect x="21" y="8" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="21" y="11" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="21" y="14" width="2" height="2" class="mrai-icon-fg"/>

  <!-- chip body (frame) -->
  <path d="M5,4 H19 V5 H20 V19 H19 V20 H5 V19 H4 V5 H5 Z" fill="none" stroke-width="2" class="mrai-icon-frame"/>

  <!-- "A" -->
  <rect x="7" y="8" width="2" height="7" class="mrai-icon-fg"/>
  <rect x="11" y="8" width="2" height="7" class="mrai-icon-fg"/>
  <rect x="9" y="8" width="2" height="2" class="mrai-icon-fg"/>
  <rect x="9" y="11" width="2" height="2" class="mrai-icon-fg"/>

  <!-- "I" -->
  <rect x="15" y="8" width="2" height="7" class="mrai-icon-fg"/>
</svg>
